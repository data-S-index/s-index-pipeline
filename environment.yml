name: s-index-pipeline
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11.14
  - pip=25.3
  - wheel=0.45.1

  # Jupyter / IPython stack
  - ipython=9.7.0
  - ipykernel=6.31.0
  - jupyter_client=8.8.0
  - jupyter_core=5.9.1
