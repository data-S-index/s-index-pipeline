# Harvests older DataCite datasets into the bunny.net storage zone, working
# backwards from the day before common.START_DATE
# (automation/datacite_harvest.py --backfill). Needs no database access; the
# "DataCite backfill load" workflow loads the files when this finishes.
# Days from START_DATE onwards are handled by the "DataCite harvest" workflow.
#
# Secrets:
#   BUNNY_STORAGE_PASSWORD
#   DISCORD_WEBHOOK_URL  channel webhook the run's result is posted to

name: DataCite backfill harvest

on:
  schedule:
    # Four times a day, one day per run, between the "DataCite harvest" runs
    - cron: "37 0,6,12,18 * * *" # 00:37, 06:37, 12:37 and 18:37 UTC
  workflow_dispatch:
    inputs:
      max_days:
        description: "Most days to harvest (blank = 1, 0 = no limit)"
        required: false

# Never run two backfill harvests at once; a new one waits for the running one.
# Separate from "DataCite harvest", which works on different days.
concurrency:
  group: datacite-backfill-harvest
  cancel-in-progress: false

permissions:
  contents: read

# Lines the script reports (common.report), posted to Discord by the last step
env:
  RUN_REPORT: ${{ github.workspace }}/run-report.txt

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Harvest
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          INPUT_MAX_DAYS: ${{ inputs.max_days }}
        run: |
          args=(--backfill)
          [[ -n "$INPUT_MAX_DAYS" ]] && args+=(--max-days "$INPUT_MAX_DAYS")

          python automation/datacite_harvest.py "${args[@]}"

      # Runs even if an earlier step failed or the run was cancelled
      - name: Post to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 automation/notify_discord.py "DataCite backfill harvest" "${{ job.status }}"
