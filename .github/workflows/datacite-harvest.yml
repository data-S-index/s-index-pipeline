# Harvests new DataCite datasets into the bunny.net storage zone
# (automation/datacite_harvest.py). Needs no database access; the
# "DataCite load" workflow loads the files into Postgres when this finishes.
#
# Secrets:
#   BUNNY_STORAGE_PASSWORD
#   DISCORD_WEBHOOK_URL  channel webhook the run's result is posted to

name: DataCite harvest

on:
  schedule:
    # Twice a day, one day per run: a backlog shrinks by one day a day, and
    # once caught up, one run a day harvests and the other has nothing to do
    - cron: "17 3,15 * * *" # 03:17 and 15:17 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Single day to harvest (YYYY-MM-DD)"
        required: false
      start:
        description: "First day of a range (YYYY-MM-DD)"
        required: false
      end:
        description: "Last day of a range, inclusive (YYYY-MM-DD)"
        required: false
      max_days:
        description: "Most days to harvest (blank = 1, 0 = no limit)"
        required: false
      force:
        description: "Re-harvest days that are already done"
        type: boolean
        default: false

# Never run two harvests at once; a new one waits for the running one
concurrency:
  group: datacite-harvest
  cancel-in-progress: false

permissions:
  contents: read

# Lines the script reports (common.report), posted to Discord by the last step
env:
  RUN_REPORT: ${{ github.workspace }}/run-report.txt

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Harvest
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_MAX_DAYS: ${{ inputs.max_days }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          [[ -n "$INPUT_DATE" ]] && args+=(--date "$INPUT_DATE")
          [[ -n "$INPUT_START" ]] && args+=(--start "$INPUT_START")
          [[ -n "$INPUT_END" ]] && args+=(--end "$INPUT_END")
          [[ -n "$INPUT_MAX_DAYS" ]] && args+=(--max-days "$INPUT_MAX_DAYS")
          [[ "$INPUT_FORCE" == "true" ]] && args+=(--force)

          python automation/datacite_harvest.py "${args[@]}"

      # Runs even if an earlier step failed or the run was cancelled
      - name: Post to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 automation/notify_discord.py "DataCite harvest" "${{ job.status }}"
