# Adds loaded DataCite days from Postgres to the Meilisearch "dataset" index
# (automation/datacite_index.py), one day per run. Runs after every
# "DataCite load" run, whether or not it succeeded (a partly failed load still
# has days to index), plus a daily fallback. Reaches the database over
# Tailscale.
#
# Secrets:
#   BUNNY_STORAGE_PASSWORD
#   DISCORD_WEBHOOK_URL  channel webhook the run's result is posted to
#   DATABASE_URL         using the database's Tailscale name or IP
#   MEILISEARCH_API_URL  Meilisearch URL and a key that can add documents
#   MEILISEARCH_API_KEY
#   TAILSCALE_OAUTH_CLIENT_ID   Tailscale OAuth client with the auth_keys scope,
#   TAILSCALE_OAUTH_SECRET      allowed to tag devices with tag:ci

name: DataCite index

on:
  workflow_run:
    workflows: ["DataCite load"]
    types: [completed]
  schedule:
    - cron: "17 11 * * *" # daily at 11:17 UTC, in case a trigger was missed
  workflow_dispatch:
    inputs:
      date:
        description: "Single day to index (YYYY-MM-DD)"
        required: false
      start:
        description: "First day of a range (YYYY-MM-DD)"
        required: false
      end:
        description: "Last day of a range, inclusive (YYYY-MM-DD)"
        required: false
      max_days:
        description: "Most days to index (blank = 1, 0 = no limit)"
        required: false
      force:
        description: "Index days again that are already indexed"
        type: boolean
        default: false

# Never run two index runs at once; a new one waits for the running one
concurrency:
  group: datacite-index
  cancel-in-progress: false

permissions:
  contents: read

# Lines the script reports (common.report), posted to Discord by the last step
env:
  RUN_REPORT: ${{ github.workspace }}/run-report.txt

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      # Joins the tailnet as an ephemeral tag:ci device, removed after the job
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Index
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILISEARCH_API_URL: ${{ secrets.MEILISEARCH_API_URL }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_MAX_DAYS: ${{ inputs.max_days }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          [[ -n "$INPUT_DATE" ]] && args+=(--date "$INPUT_DATE")
          [[ -n "$INPUT_START" ]] && args+=(--start "$INPUT_START")
          [[ -n "$INPUT_END" ]] && args+=(--end "$INPUT_END")
          [[ -n "$INPUT_MAX_DAYS" ]] && args+=(--max-days "$INPUT_MAX_DAYS")
          [[ "$INPUT_FORCE" == "true" ]] && args+=(--force)

          python automation/datacite_index.py "${args[@]}"

      # Runs even if an earlier step failed or the run was cancelled
      - name: Post to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 automation/notify_discord.py "DataCite index" "${{ job.status }}"
